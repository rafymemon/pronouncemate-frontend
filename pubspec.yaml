name: pronouncemate
description: AI-Powered Pronunciation Detection and Improvement System - FYP 2025
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  http: ^1.2.0
  record: ^6.1.1          # microphone recording
  shared_preferences: ^2.2.2   # store auth token locally
  path_provider: ^2.1.2   # temp file storage
  file_picker: ^8.0.0
  fl_chart: ^0.68.0  # For line and pie charts
  just_audio: ^0.9.46
  web_socket_channel: ^3.0.3
  share_plus: ^10.1.2     # ADDED: powers "Share as Image" / "Share as Text"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true